name: Aura Stream Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Patch provider stream termination
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/electron/providers.ts')
          s=p.read_text()
          s=s.replace("  groq: 2048,\n  cerebras: 2048,", "  groq: 8192,\n  cerebras: 8192,")
          s=s.replace("onDone: (text: string, model?: string, usage?: { input: number; output: number; total: number }) => void", "onDone: (text: string, model?: string, usage?: { input: number; output: number; total: number }, finishReason?: string | null) => void")
          s=s.replace("  let finalAnswerRetried = false\n", "  let finalAnswerRetried = false\n  let lastFinishReason: string | null = null\n", 1)
          s=s.replace("        if (chunk.model) lastModel = chunk.model\n", "        if (chunk.model) lastModel = chunk.model\n        if (chunk.choices?.[0]?.finish_reason) lastFinishReason = chunk.choices[0].finish_reason\n", 1)
          s=s.replace("  callbacks.onDone(finalText, streamOpts?.publicModelName ?? lastModel)\n", "  callbacks.onDone(finalText, streamOpts?.publicModelName ?? lastModel, undefined, lastFinishReason)\n", 1)
          s=s.replace("  callbacks.onDone(text || thinking, final.model, {\n    input: final.usage.input_tokens,\n    output: final.usage.output_tokens,\n    total: final.usage.input_tokens + final.usage.output_tokens,\n  })", "  callbacks.onDone(text || thinking, final.model, {\n    input: final.usage.input_tokens,\n    output: final.usage.output_tokens,\n    total: final.usage.input_tokens + final.usage.output_tokens,\n  }, final.stop_reason)", 1)
          if 'finishReason?: string | null' not in s:
              raise SystemExit('provider callback signature patch did not apply')
          p.write_text(s)
          PY
      - run: npx tsc -p tsconfig.electron.json --noEmit
      - run: npm run build
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/aura-stream-fix.yml
          git add src/electron/providers.ts .github/workflows/aura-stream-fix.yml
          git commit -m 'fix: preserve provider finish reasons and output budgets'
          git push origin HEAD:main
